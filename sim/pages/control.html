<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Control del presentador</title>
<style>
  :root { --bg:#0b0d12; --panel:#141824; --fg:#e8eaf0; --mute:#8b93a7; --oro:#facc15; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.4 system-ui, sans-serif; padding:16px; max-width:900px; margin:auto; }
  h1 { font-size:20px; margin:0 0 4px; } .mute { color:var(--mute); }
  section { background:var(--panel); border-radius:12px; padding:14px; margin:12px 0; }
  h2 { font-size:13px; letter-spacing:.2em; color:var(--mute); margin:0 0 10px; text-transform:uppercase; }
  button { font:inherit; background:#232a3b; color:var(--fg); border:0; border-radius:8px; padding:10px 14px; margin:3px; cursor:pointer; }
  button:hover { background:#2f3850; } .si { background:#166534; } .no { background:#7f1d1d; }
  .prop { display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid #222838; }
  .prop .t { flex:1; } .estado { font-size:12px; padding:2px 8px; border-radius:999px; background:#232a3b; }
  .pendiente .estado { background:#854d0e; } .aprobada .estado { background:#166534; } .rechazada { opacity:.45; }
  #fase { font-weight:700; color:var(--oro); }
</style>
</head>
<body>
<h1>Control del presentador</h1>
<div class="mute">Nunca se proyecta: aquí se modera antes de que nada llegue a la pantalla grande. Fase: <span id="fase">–</span></div>
<section>
  <h2>Partida</h2>
  <button data-a="iniciar">Iniciar / continuar</button><button data-a="pausar">Pausa</button>
  <button data-a="saltar">Saltar fase</button><button data-a="final">Ir a la final</button><button data-a="reiniciar">Reiniciar evento</button>
</section>
<section><h2>Propuestas del público</h2><div id="lista" class="mute">Sin propuestas todavía.</div></section>
<script src="/socket.io/socket.io.js"></script>
<script type="module">
import * as C from '/shared/contract.js';
const { EV } = C;
const $ = (id) => document.getElementById(id);
let key = new URLSearchParams(location.search).get('key'); try { key = key || sessionStorage.getItem('visorKey'); } catch {}
if (!key) key = prompt('Clave del visor') || ''; try { sessionStorage.setItem('visorKey', key); } catch {}
const socket = io({ transports: ['websocket'] });
socket.on('connect', () => socket.emit(EV.VISOR_JOIN, { key }, (r) => { if (!r.ok) $('fase').textContent = 'CLAVE INCORRECTA'; }));
socket.on(EV.FASE, (f) => { $('fase').textContent = `${f.fase}${f.pausado ? ' (pausa)' : ''}`; });
const ctl = (accion, id) => socket.emit(EV.CONTROL, { accion, id }, (r) => { if (!r.ok) alert(r.error); });
document.querySelectorAll('[data-a]').forEach((b) => { b.onclick = () => ctl(b.dataset.a); });
socket.on(EV.PROPUESTAS, (l) => {
  if (!l.length) { $('lista').textContent = 'Sin propuestas todavía.'; return; }
  $('lista').innerHTML = '';
  for (const p of [...l].reverse()) {
    const d = document.createElement('div'); d.className = `prop ${p.estado}`;
    d.innerHTML = `<span class="t"></span><span class="mute"></span><span class="estado">${p.estado}</span>`;
    d.querySelector('.t').textContent = p.texto; d.querySelector('.mute').textContent = `${p.autor} · ${p.votos} votos`;
    if (p.estado === 'pendiente') {
      const si = document.createElement('button'); si.className = 'si'; si.textContent = 'Aprobar'; si.onclick = () => ctl('aprobar', p.id);
      const no = document.createElement('button'); no.className = 'no'; no.textContent = 'Rechazar'; no.onclick = () => ctl('rechazar', p.id);
      d.append(si, no);
    }
    $('lista').appendChild(d);
  }
});
</script>
</body>
</html>
