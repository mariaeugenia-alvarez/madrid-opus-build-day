<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Jugar (simulador)</title>
<style>
  :root { --bg:#0b0d12; --panel:#141824; --fg:#e8eaf0; --mute:#8b93a7; }
  * { box-sizing:border-box; -webkit-user-select:none; user-select:none; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.4 system-ui, sans-serif; height:100dvh;
         display:flex; flex-direction:column; touch-action:none; }
  .pad { padding:16px; }
  input, button { font:inherit; border-radius:10px; border:0; padding:12px; }
  input[type=text] { width:100%; background:var(--panel); color:var(--fg); margin-bottom:10px; }
  button { background:#3b82f6; color:#fff; font-weight:700; width:100%; }
  #juego { display:none; flex:1; flex-direction:column; }
  #hud { display:flex; justify-content:space-between; padding:12px 16px; background:var(--panel); }
  #zona { flex:1; display:grid; grid-template-columns: 1fr 1fr; align-items:center; }
  #stick { width:160px; height:160px; border-radius:50%; background:#1b2030; margin:auto; position:relative; }
  #bola { width:64px; height:64px; border-radius:50%; background:#3b4566; position:absolute; left:48px; top:48px; }
  #accion { width:140px; height:140px; border-radius:50%; margin:auto; display:block; background:#ef4444; font-size:18px; }
  #accion[disabled] { background:#3a2a2a; }
  #parche { display:none; padding:12px 16px; background:var(--panel); }
  #parche button { margin:4px 0; background:#232a3b; text-align:left; font-weight:400; }
  #anuncio { position:fixed; inset:0; display:none; place-items:center; background:rgba(0,0,0,.7);
             font-size:40px; font-weight:800; text-align:center; pointer-events:none; }
  small { color:var(--mute); }
</style>
</head>
<body>
<div id="entrada" class="pad">
  <h2>La sala es el código</h2>
  <input id="alias" type="text" maxlength="12" placeholder="Tu alias (máx. 12)">
  <input id="color" type="color" value="#22c55e">
  <button id="entrar">Entrar al match</button>
  <p><small id="msg"></small></p>
</div>
<div id="juego">
  <div id="hud">
    <div><b id="puntos">0</b> pts · <span id="pos">–</span></div>
    <div><span id="fase">–</span> <span id="reloj"></span></div>
  </div>
  <div id="parche">
    <div><b>Vota el próximo parche</b></div>
    <div id="cands"></div>
    <input id="prop" type="text" maxlength="80" placeholder="Propón una regla (máx. 80)">
    <button id="enviar">Enviar propuesta</button>
  </div>
  <div id="zona">
    <div id="stick"><div id="bola"></div></div>
    <button id="accion">EMBESTIR</button>
  </div>
</div>
<div id="anuncio"></div>
<script src="/socket.io/socket.io.js"></script>
<script type="module">
  import * as CONTRATO from '/shared/contract.js';
  const { EV, FASES } = CONTRATO;
  const $ = (id) => document.getElementById(id);
  const socket = io({ transports: ['websocket'] });
  let dx = 0, dy = 0, accion = 0, finFase = 0, unido = false, miVoto = null;

  $('alias').value = localStorage.getItem('alias') || '';
  $('entrar').onclick = () => {
    const alias = $('alias').value.trim();
    socket.emit(EV.JOIN, { alias, color: $('color').value }, (r) => {
      if (!r.ok) { $('msg').textContent = r.error; return; }
      try { localStorage.setItem('alias', alias); } catch {}
      unido = true; $('entrada').style.display = 'none'; $('juego').style.display = 'flex';
      $('msg').textContent = `Equipo ${r.equipo}${r.espectador ? ' · espectador hasta la próxima ronda' : ''}`;
    });
  };

  socket.on(EV.ME, (m) => {
    $('puntos').textContent = m.puntos;
    $('pos').textContent = `${m.posicion}º de ${m.de} · ${m.equipo}${m.espectador ? ' · espectador' : ''}`;
    $('accion').disabled = m.recargaMs > 0;
    miVoto = m.voto;
  });
  socket.on(EV.FASE, (f) => {
    $('fase').textContent = f.fase; finFase = performance.now() + f.restanteMs;
    $('parche').style.display = f.fase === FASES.PARCHE ? 'block' : 'none';
    if (f.fase === FASES.PARCHE) pintarCandidatas(f.datos.candidatas || []);
  });
  socket.on(EV.VOTACION, pintarCandidatas);
  socket.on(EV.ANUNCIO, (a) => {
    $('anuncio').textContent = a.titulo; $('anuncio').style.display = 'grid';
    clearTimeout(window._an); window._an = setTimeout(() => { $('anuncio').style.display = 'none'; }, 1500);
  });
  function pintarCandidatas(l) {
    $('cands').innerHTML = '';
    for (const c of l) {
      const b = document.createElement('button');
      b.textContent = `${miVoto === c.id ? '✔ ' : ''}${c.texto} · ${c.votos}`;
      b.onclick = () => socket.emit(EV.VOTO, { id: c.id }, (r) => { if (!r.ok) $('msg').textContent = r.error; });
      $('cands').appendChild(b);
    }
  }
  $('enviar').onclick = () => {
    socket.emit(EV.PROPUESTA, { texto: $('prop').value }, (r) => { if (r.ok) $('prop').value = ''; });
  };

  // Joystick
  const stick = $('stick'), bola = $('bola'); let origen = null;
  stick.addEventListener('pointerdown', (e) => { origen = stick.getBoundingClientRect(); mover(e); stick.setPointerCapture(e.pointerId); });
  stick.addEventListener('pointermove', (e) => origen && mover(e));
  stick.addEventListener('pointerup', () => { origen = null; dx = dy = 0; bola.style.transform = ''; });
  function mover(e) {
    const cx = origen.left + origen.width / 2, cy = origen.top + origen.height / 2;
    let x = (e.clientX - cx) / 60, y = (e.clientY - cy) / 60; const m = Math.hypot(x, y);
    if (m > 1) { x /= m; y /= m; }
    dx = +x.toFixed(2); dy = +y.toFixed(2); bola.style.transform = `translate(${dx * 48}px, ${dy * 48}px)`;
  }
  $('accion').addEventListener('pointerdown', () => { accion = 1; });
  // Teclado (escritorio): WASD / flechas + espacio
  const teclas = new Set();
  addEventListener('keydown', (e) => { teclas.add(e.key.toLowerCase()); if (e.key === ' ') accion = 1; });
  addEventListener('keyup', (e) => teclas.delete(e.key.toLowerCase()));

  let ultimo = '';
  setInterval(() => {
    if (!unido) return;
    let kx = 0, ky = 0;
    if (teclas.has('a') || teclas.has('arrowleft')) kx -= 1; if (teclas.has('d') || teclas.has('arrowright')) kx += 1;
    if (teclas.has('w') || teclas.has('arrowup')) ky -= 1; if (teclas.has('s') || teclas.has('arrowdown')) ky += 1;
    const v = origen ? [dx, dy, accion] : [kx || dx, ky || dy, accion];
    const k = v.join(',');
    if (k !== ultimo || accion) { socket.volatile.emit(EV.INPUT, v); ultimo = k; }
    accion = 0;
  }, 50);
  setInterval(() => { $('reloj').textContent = `${Math.ceil(Math.max(0, finFase - performance.now()) / 1000)} s`; }, 250);
</script>
</body>
</html>
